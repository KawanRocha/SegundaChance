<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Especial</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
body {
background-color: #121212;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
}
/* Container simulando a tela do smartphone */
.phone-container {
width: 360px;
height: 700px;
background: linear-gradient(180deg, #d32f2f 0%, #8e0000 100%);
border-radius: 40px;
box-shadow: 0 20px 40px rgba(0,0,0,0.6);
position: relative;
overflow: hidden;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 20px;
border: 8px solid #222;
}
/* Notch do topo */
.phone-container::before {
content: '';
position: absolute;
top: 10px;
width: 120px;
height: 25px;
background-color: #222;
border-radius: 15px;
z-index: 10;
}
.screen {
width: 100%;
height: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
color: white;
z-index: 2;
}
.hidden {
display: none !important;
}
.emoji {
font-size: 80px;
margin-bottom: 20px;
}
h2 {
font-size: 1.4rem;
margin-bottom: 20px;
text-transform: uppercase;
font-weight: 800;
letter-spacing: 1px;
}
.btn-group {
display: flex;
gap: 15px;
margin-top: 20px;
position: relative;
width: 100%;
justify-content: center;
}
button, .btn {
background-color: #ffffff;
color: #d32f2f;
border: none;
padding: 12px 24px;
font-size: 1rem;
font-weight: bold;
border-radius: 25px;
cursor: pointer;
box-shadow: 0 4px 10px rgba(0,0,0,0.3);
transition: transform 0.1s;
}
